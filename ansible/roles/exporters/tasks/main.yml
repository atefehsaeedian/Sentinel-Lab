---
- name: Create Node Exporter system group
  ansible.builtin.group:
    name: "{{ exporters_node_exporter_group }}"
    system: true
    state: present
  become: true

- name: Create Node Exporter system user
  ansible.builtin.user:
    name: "{{ exporters_node_exporter_user }}"
    group: "{{ exporters_node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present
  become: true

- name: Download Node Exporter archive
  ansible.builtin.get_url:
    url: >-
      https://github.com/prometheus/node_exporter/releases/download/v{{ exporters_node_exporter_version }}/{{ exporters_node_exporter_archive_name }}
    dest: "{{ exporters_node_exporter_download_dir }}/{{ exporters_node_exporter_archive_name }}"
    checksum: "sha256:{{ exporters_node_exporter_sha256 }}"
    mode: "0644"
  become: true

- name: Extract Node Exporter binary
  ansible.builtin.unarchive:
    src: "{{ exporters_node_exporter_download_dir }}/{{ exporters_node_exporter_archive_name }}"
    dest: "{{ exporters_node_exporter_download_dir }}"
    remote_src: true
    creates: "{{ exporters_node_exporter_extract_dir }}/node_exporter"
  become: true
  when: not ansible_check_mode

- name: Install Node Exporter binary
  ansible.builtin.copy:
    src: "{{ exporters_node_exporter_download_dir }}/node_exporter-{{ exporters_node_exporter_version }}.linux-{{ exporters_node_exporter_arch }}/node_exporter"
    dest: "{{ exporters_node_exporter_install_dir }}/node_exporter"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  become: true
  when: not ansible_check_mode
  notify: Restart Node Exporter

- name: Install Node Exporter systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  become: true
  when: not ansible_check_mode
  notify:
    - Reload systemd
    - Restart Node Exporter

- name: Enable and start Node Exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: not ansible_check_mode
