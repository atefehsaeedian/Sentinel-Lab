#cloud-config
hostname: ${hostname}
manage_etc_hosts: true

users:
  - default
  - name: ${username}
    gecos: DevOps user
    groups:
      - adm
      - sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ${ssh_public_key}

ssh_pwauth: false
disable_root: true
